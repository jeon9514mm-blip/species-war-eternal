<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Unity UI 검토용 미리보기 — 실행 캡처 아님</title><style>
@font-face{font-family:Eternal;src:url('__FONT__')}*{box-sizing:border-box}html,body{margin:0;background:#090e10;color:#d9d6cc;font-family:Eternal,sans-serif;font-weight:400}button{font-family:inherit;color:inherit;font-weight:400}button,.btn{height:40px;min-width:86px;padding:0 12px;background:#1a2427;border:1px solid #455250;border-radius:7px;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}button.active{background:#c4a385;color:#0e1315;border-color:#c4a385}.banner{height:56px;background:#202722;border-bottom:2px solid #c4a385;display:flex;align-items:center;padding:0 24px;gap:20px;font-size:17px}.banner strong{font-size:18px;color:#ead4b8;font-weight:400}.banner span{font-size:12px;color:#b5beb1;margin-left:auto}.app{position:relative;width:1600px;height:900px;overflow:hidden}.hud{height:900px;display:flex;flex-direction:column}.header,.dock{background:rgba(14,19,21,.96);border:1px solid #455252;flex-shrink:0}.header{height:94px;padding:8px 20px 7px}.header-main{height:43px;display:flex;align-items:center}.stage{font-size:22px;flex:1}.money{display:flex;gap:6px;margin-right:12px}.badge{display:flex;align-items:center;gap:6px;background:#172124;height:34px;padding:0 10px 0 8px;border-radius:8px;font-size:14px}.badge svg{width:21px;height:21px;color:#c4a385}.badge.gem svg{color:#73d1d1}.header button{height:36px;min-width:0;margin-left:5px;padding:0 5px;font-size:13px}.track{height:4px;background:#243033;overflow:hidden}.track>i{height:100%;display:block;background:#c4a385;width:62%}.caption{height:21px;margin-top:3px;font-size:12px;color:#a8b89e}.arena{flex:1;position:relative;overflow:hidden;background-size:cover;background-position:center}.actor{position:absolute;display:flex;justify-content:center;align-items:flex-end}.actor:before{content:'';position:absolute;width:48%;height:8px;left:26%;bottom:2px;background:rgba(0,0,0,.26);border-radius:50%}.artframe{position:relative;flex-shrink:0;overflow:hidden;background-repeat:no-repeat;z-index:1}.portrait-box{display:flex;align-items:center;justify-content:center;flex-shrink:0}.unit-label{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;color:#f2eddd;font-size:11px;white-space:nowrap;text-shadow:0 1px 3px #000}.unit-health{height:3px;width:44px;position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);background:#283132}.unit-health>i{height:100%;width:86%;background:#a8b89e;display:block}.enemy .unit-health>i{background:#bd776b}.zoom{position:absolute;right:18px;top:12px;display:flex;gap:4px}.zoom button{width:38px;height:38px;min-width:0;padding:0;border-radius:19px;font-size:10px}.zoom button:first-child{background:#4a5947}.dock{height:150px;padding:4px 14px}.live-status{height:25px;display:flex;align-items:center;font-size:12px}.live-status>.note{flex:1}.live-status .chain{font-size:11px;color:#c4a385;margin-right:8px}.live-status button{height:24px;min-width:0;width:104px;font-size:11px;padding:0 5px;margin-left:5px}.party-row{height:68px;display:flex;justify-content:center;align-items:center}.hero-card{flex:1;max-width:180px;height:64px;min-width:0;border:1px solid #405050;border-radius:7px;background:#171f21;margin:0 2px;padding:2px 6px}.hero-name{height:17px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-summary{height:35px;display:flex;align-items:center;gap:5px}.hero-summary .portrait-box{width:42px;height:35px}.hero-level{height:17px;font-size:12px;color:#a8b89e}.hero-state{height:17px;font-size:11px;color:#c4a385}.hero-hp{height:3px;margin-top:1px}.hero-ult{height:2px;margin-top:1px}.hero-hp i{background:#a8b89e}.nav{height:45px;display:flex;align-items:center}.nav button{height:40px;min-width:0;flex:1;margin:0 3px;gap:9px;font-size:15px}.nav svg{height:23px;width:23px}.nav button.active{background:#c4a385;color:#0e1315}.shade{position:absolute;inset:0;background:rgba(3,5,6,.76)}.window{position:absolute;right:18px;top:86px;bottom:106px;padding:16px 18px;display:fl ex;flex-direction:column;min-height:0}.information .name{font-size:25px;margin:2px 0}.class{font-size:12px;color:#a8b89e;margin:2px 0}.level-value{font-size:15px;color:#c4a385;margin:2px 0}.tabs{display:flex;margin:9px 0 10px;flex-shrink:0}.tabs button{flex:1;flex-basis:0;min-width:0;height:39px;font-size:12px;padding:0 2px;margin-right:4px;background:#0e1315}.tabs button:last-child{font-size:11px;margin-right:0}.tabs button.active{background:#c4a385}.detail-scroll{flex:1;min-height:0;overflow:auto;padding-right:12px}.stat-row{display:flex;margin-bottom:8px;gap:5px}.stat{flex:1;min-width:0}.stat .label{font-size:11px;color:#a8b89e;margin:2px 0}.stat .value{font-size:18px;margin:2px 0}.small{font-size:11px;color:#a8b89e;margin:2px 0}.xp{font-size:12px;color:#a8b89e;margin-top:10px}.xp-track{height:6px;margin:4px 0 15px}.xp-track i{background:#a8b89e}.research-title{font-size:17px;margin:2px 0}.research button{height:39px;width:100%;margin-top:7px;font-size:14px}.research .info{font-size:12px;line-height:1.6;color:#a8b89e;margin-top:10px}.deploy{height:40px;margin-top:8px;flex-shrink:0}.formation-footer{display:flex;height:59px;align-items:center;flex-shrink:0}.formation-footer>.muted{width:57px;font-size:12px;line-height:1.4}.mini-party{display:flex;height:58px;align-items:center}.mini-slot{width:44px;height:48px;display:flex;align-items:center;justify-content:center;margin-top:2px;margin-right:5px;border:1px solid #455250;border-radius:7px;padding:2px;background:#0e1315}.mini-slot.selected{background:#c4a385}.menu-scroll{flex:1;min-height:0;margin-top:16px;overflow:auto;padding-right:12px}.features{height:250px;margin-bottom:16px;display:flex}.feature{position:relative;background:#121d26;border:1px solid #425763;border-radius:5px;overflow:hidden;min-width:0}.feature-art{position:absolute;inset:0;background-size:cover;background-position:center}.feature-war{width:18%;margin-right:10px;flex-shrink:0}.feature-war>.feature-emblem{margin-top:46px}.feature-right{flex:1;min-width:0}.feature-row{height:120px;display:flex;gap:10px}.feature-row+.feature-row{margin-top:10px}.feature-row .feature{flex:1;min-width:0}.feature-emblem{height:54px;width:54px;color:#c4a385;margin:5px auto 0}.feature-caption{position:absolute;bottom:0;left:0;right:0;padding:7px 4px 8px;background:rgba(6,14,20,.88);text-align:center}.feature-name{font-size:19px}.feature-subtitle{font-size:12px;color:#a8b89e;margin-top:2px}.feature.disabled{opacity:.53}.feature.disabled .feature-subtitle{color:#c4a385}.link-grid{display:flex;flex-wrap:wrap}.menu-link{width:16.666%;height:92px;padding:8px 3px 4px;text-align:center;display:flex;flex-direction:column;align-items:center}.menu-link svg{width:32px;height:32px;flex-shrink:0}.menu-link .link-name{font-size:14px;margin-top:6px}.menu-link.disabled{opacity:.46}.pending{font-size:10px;color:#c4a385}.preferences{display:flex;align-items:center;flex-shrink:0;margin-top:12px;padding-top:12px;border-top:1px solid rgba(64,87,99,.7);height:66px;font-size:14px}.toggle{display:flex;align-items:center;margin-right:16px;height:40px;gap:7px}.checkbox{width:15px;height:15px;background:#c4a385;color:#172124;display:inline-flex;align-items:center;justify-content:center;border-radius:2px;font-size:12px}.preferences .space{flex:1}.preferences button{height:42px}.review-scene{display:none}.review-scene.visible{display:block}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#6a7e71;border-radius:4px}::-webkit-scrollbar-track{background:#182224}svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><div class="banner"><strong>UI 검토용 미리보기 · Unity 실행 캡처 아님</strong><div id="view-title">사냥 HUD</div><span>변경 소스 기준 정적 구성 · 배경/캐릭터 배치와 수치는 예시</span></div><main class="app"><div id="base"></div><section id="hero" class="review-scene shade"></section><section id="menu" class="review-scene shade"></section></main><script>
const DATA=__DATA__;
const paths={sword:'M8 15 17 4 21 3 20 7 10 17 M6 13 12 19 M8 17 4 21 M3 19 5 21',hero:'M5 20 A7 7 0 0 1 19 20 H5 M8.8 3.7 9.5 1.8 12 3.3 14.5 1.8 15.2 3.7',shield:'M12 3 20 6 19 14 16 18 12 21 8 18 5 14 4 6 12 3 M12 7 V16 M8 11 H16',bag:'M5 8 19 8 20 20 4 20 5 8 M8 8 A4 4 0 0 1 16 8 M8 12 V13 M16 12 V13 M8 14 A4 4 0 0 0 16 14',hamburger:'M3 5 H21 M3 12 H21 M3 19 H21',gem:'M6 4 18 4 22 9 12 21 2 9 6 4 M2 9 H22 M8 4 7 9 12 21 17 9 16 4',coin:'M12 7 15 12 12 17 9 12 12 7',compass:'M15.6 7.2 13.2 13.4 8.4 16.8 10.8 10.6 15.6 7.2 M10.8 10.6 13.2 13.4',journal:'M7 3 H20 V19 H7 Z M7 6 H4 V21 H17 V19 M10 8 H17 M10 12 H17 M10 16 H14',gift:'M3 9 H21 V13 H3 Z M5 13 V21 H19 V13 M12 9 V21',summon:'M11 3 13.5 9 20 11 13.5 13.5 11 20 8.5 13.5 2 11 8.5 9 11 3 M19 2 V6 M17 4 H21',growth:'M5 20 V15 H8 V20 M11 20 V11 H14 V20 M17 20 V7 H20 V20 M4 10 11 5 17 3 M13.5 2.5 H18 L17.4 6.5',home:'M3 10.5 12 3 21 10.5 M5 9 V20 H10 V14 H14 V20 H19 V9'};
function icon(kind){let parts=`<path d="${paths[kind]||paths.compass}"/>`;if(kind==='hero')parts+='<circle cx="12" cy="7.5" r="3.5"/>';if(['coin','compass'].includes(kind))parts+='<circle cx="12" cy="12" r="9"/>';if(kind==='coin')parts+='<circle cx="12" cy="12" r="6"/>';if(kind==='gift')parts+='<circle cx="8.5" cy="6" r="3"/><circle cx="15.5" cy="6" r="3"/>';if(kind==='settings'){parts='<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.2"/>';for(let i=0;i<8;i++){let a=i*Math.PI/4;parts+=`<path d="M${12+Math.cos(a)*7} ${12+Math.sin(a)*7} L${12+Math.cos(a)*9.5} ${12+Math.sin(a)*9.5}"/>`;}}return `<svg viewBox="0 0 24 24">${parts}</svg>`;}
function art(id,w,h){let a=DATA.actors[id],r=a.region,s=Math.min(w/r[2],h/r[3]);return `<div class="portrait-box" style="width:${w}px;height:${h}px"><div class="artframe" style="width:${r[2]*s}px;height:${r[3]*s}px;background-image:url('${a.uri}');background-size:${1024*s}px ${1024*s}px;background-position:${-r[0]*s}px ${-r[1]*s}px"></div></div>`;}
let team=DATA.heroes.slice(0,10);
function hud(){let heroes=team.map((h,i)=>`<div class="hero-card"><div class="hero-name">${h.name.split(' ')[0]}</div><div class="hero-summary">${art(h.id,42,35)}<div><div class="hero-level">Lv.20</div><div class="hero-state">${i===2?'각성 준비':i%3===0?'3초':'준비'}</div></div></div><div class="track hero-hp"><i style="width:${[91,83,100,75,96,86,100,81,92,98][i]}%"></i></div><div class="track hero-ult"><i style="width:${[64,48,100,26,72,39,68,90,43,62][i]}%"></i></div></div>`).join('');let units=team.map((h,i)=>{let x=435+(i%3)*85+(i>5?30:0),y=145+Math.floor(i/3)*65;return `<div class="actor" style="left:${x}px;top:${y}px">${art(h.id,84,102)}<div class="unit-label">${h.name.split(' ')[0]}</div><div class="unit-health"><i></i></div></div>`;}).join('');units+=[['fallen_werewolf',875,190],['fallen_ogre',1025,260],['fallen_lich',1110,110],['fallen_werewolf',955,405],['fallen_ogre',1140,400],['fallen_lich',785,380]].map(([id,x,y])=>`<div class="actor enemy" style="left:${x}px;top:${y}px">${art(id,96,110)}<div class="unit-health"><i></i></div></div>`).join('');return `<div class="hud"><header class="header"><div class="header-main"><div class="stage">끝없는 사냥터 · 초원의 길　·　24 스테이지</div><div class="money"><div class="badge">${icon('coin')}24,680</div><div class="badge gem">${icon('gem')}1,240</div></div><button style="width:64px">편성</button><button style="width:96px">일시정지</button><button style="width:52px">×1</button><button style="width:62px">관리</button></div><div class="track"><i></i></div><div class="caption">다음 무리 62% · 원정대가 자동으로 사냥 중입니다</div></header><div class="arena" style="background-image:url('${DATA.images.meadow}')">${units}<div class="zoom">${['×1','×1.5','×2','×3'].map(x=>`<button>${x}</button>`).join('')}</div></div><footer class="dock"><div class="live-status"><span class="note">자동사냥 중　·　원정대 10 / 10　·　적 6</span><span class="chain">연계 준비</span><button>연계 펼치기</button></div><div class="party-row">${heroes}</div><div class="nav">${['사냥','영웅','도전','가방','메뉴'].map((x,i)=>`<button class="${i===0?'active':''}">${icon(['sword','hero','shield','bag','hamburger'][i])}${x}</button>`).join('')}</div></footer></div>`;}
function hero(){const h=team[0];return `<div class="window wide"><div class="window-head"><div class="window-title">영웅 · 아우렐리아</div><button>닫기</button></div><div class="toolbar"><div class="wallet muted">골드 24,680　 ·　 젬 1,240</div><button>원정대 편성</button></div><div class="showcase-body"><div class="panel roster"><div class="roster-title">영웅 목록　15</div><div class="roster-scroll">${DATA.heroes.map((x,i)=>`<div class="roster-card ${i===0?'selected':''}">${art(x.id,48,62)}<div class="roster-copy"><div class="name">${x.name}</div><div class="level">Lv.20${i<10?' · 출전':''}</div></div></div>`).join('')}</div></div><div class="hero-content"><div class="showcase-art"><div class="grade">SR</div><div class="identity">${h.identity}</div><div class="main-portrait">${art(h.id,660,377)}</div><div class="deployment">출전 · 1번 자리</div></div><div class="panel information"><div class="name">${h.name}</div><div class="class">${h.race} · ${h.class} · ${h.role_group}</div><div class="level-value">LEVEL　20 / 100</div><div class="tabs">${['성장','스킬','장비','승급 · 돌파'].map((x,i)=>`<button class="${i===0?'active':''}">${x}</button>`).join('')}</div><div class="detail-scroll"><div class="stat-row">${[['공격력','156'],['방어력','115'],['체력','1,240']].map(x=>`<div class="panel stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="small">장비 · 연구 · 진형 · 시너지 반영</div><div class="xp">EXP　340 / 860 · 전투로 성장</div><div class="track xp-track"><i style="width:40%"></i></div><div class="research-title">성장 연구　3 P 남음</div><div class="research">${[['공격',2],['생존',1],['기능',0]].map(x=>`<button>${x[0]}　 ${x[1]} / 10　　+ 1 P</button>`).join('')}<div class="info">영웅 레벨이 3 오를 때마다 연구 포인트를 얻어요.</div></div></div><button class="deploy">배치 해제</button></div></div></div><div class="formation-footer"><div class="muted">원정대<br>10 / 10</div><div class="mini-party">${team.map((x,i)=>`<div class="mini-slot ${i===0?'selected':''}">${art(x.id,38,40)}</div>`).join('')}</div></div></div>`;}
function feature(id,title,subtitle,picture='',disabled=false){return `<div class="feature ${id==='war'?'feature-war':''} ${disabled?'disabled':''}">${picture?`<div class="feature-art" style="background-image:url('${DATA.images[picture]}')"></div>`:`<div class="feature-emblem">${icon(id==='war'||id==='raid'?'sword':id)}</div>`}<div class="feature-caption"><div class="feature-name">${title}</div><div class="feature-subtitle">${subtitle}</div></div></div>`;}
function menu(){const links=[['가방','bag'],['영웅','hero'],['파티 편성','hero'],['전투 진형','shield'],['영웅 도감','journal'],['성장 연구','growth'],['보상 센터','gift'],['목표 · 업적','journal',true],['거래소','coin',true],['진영 선택','sword'],['가이드','compass'],['설정','settings']];return `<div class="window drawer"><div class="window-head"><div class="window-title">전체 메뉴</div><button class="quick" style="opacity:.45">${icon('journal')}</button><button class="quick">${icon('gift')}</button><button style="margin-left:8px">닫기</button></div><div class="menu-scroll"><div class="features">${feature('war','종의 전쟁','전쟁 기능 이관 중','',true)}<div class="feature-right"><div class="feature-row">${feature('camp','원정 캠프','모험의 시작','camp')}${feature('world','사냥터','지역과 보상','world')}</div><div class="feature-row">${feature('summon','소환','영웅과 수호령')}${feature('raid','레이드','보스 토벌','raid')}${feature('growth','성장 · 던전','도전과 성장')}</div></div></div><div class="link-grid">${links.map(x=>`<div class="menu-link ${x[2]?'disabled':''}">${icon(x[1])}<div class="link-name">${x[0]}</div>${x[2]?'<div class="pending">이관 중</div>':''}</div>`).join('')}</div></div><div class="preferences"><div class="toggle"><span class="checkbox">✓</span>스킬 효과 ON</div><div class="toggle"><span class="checkbox">✓</span>효과음 ON</div><span class="space"></span><button>시작 화면</button></div></div>`;}
document.querySelector('#base').innerHTML=hud();document.querySelector('#hero').innerHTML=hero();document.querySelector('#menu').innerHTML=menu();const mode=new URLSearchParams(location.search).get('view')||'hunt';if(mode!=='hunt')document.querySelector('#'+mode).classList.add('visible');document.querySelector('#view-title').textContent={hunt:'01 · 사냥 HUD',hero:'02 · 영웅 관리',menu:'03 · 전체 메뉴'}[mode];window.previewReady=true;
</script></body></html>
